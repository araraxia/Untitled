<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
        <div id="ui-overlay">
            <div id="loading-indicator" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 24px; color: #4CAF50;">
                <p>Loading Game...</p>
                <p style="font-size: 14px; margin-top: 10px;">Connecting to server...</p>
            </div>
        </div>
    </div>

    <!-- Socket.IO client (vendored 4.5.4, MIT license) -->
    <script src="js/socket.io.min.js"></script>
    
    <!-- Sprite and animation system -->
    <script src="js/sprites/spritesheet.js"></script>
    <script src="js/sprites/animation.js"></script>
    <script src="js/sprites/shaderCache.js"></script>
    <script src="js/sprites/gpuBuffers.js"></script>
    <script src="js/sprites/gpuSpriteSheet.js"></script>
    <script src="js/entityRenderer.js"></script>
    
    <!-- Character creation system -->
    <script src="js/characterCreation.js"></script>
    
    <!-- Game scripts -->
    <script src="js/playerSelect.js"></script>
    <script src="js/network.js"></script>
    <script src="js/interpolation.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
